<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FastAPI Demo{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">⚡ FastAPI Demo</div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products">Products</a></li>
      <li><a href="/team">Team</a></li>
      <li><a href="/docs" target="_blank">API Docs</a></li>
    </ul>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Built with <strong>FastAPI</strong> &amp; Python · Deployed on Render</p>
    <p class="footer-api">
      API: <a href="/api/health">/api/health</a> ·
      <a href="/api/products">/api/products</a> ·
      <a href="/api/team">/api/team</a>
    </p>
  </footer>
</body>
</html>
