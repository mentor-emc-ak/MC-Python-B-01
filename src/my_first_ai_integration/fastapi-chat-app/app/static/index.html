<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen" class="screen">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="18" fill="#6c63ff"/>
          <path d="M11 18c0-3.866 3.134-7 7-7s7 3.134 7 7-3.134 7-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="18" cy="18" r="2.5" fill="#fff"/>
        </svg>
        <span>AI Chat</span>
      </div>

      <div class="tab-bar" role="tablist">
        <button class="tab active" data-tab="login" role="tab">Login</button>
        <button class="tab" data-tab="register" role="tab">Register</button>
      </div>

      <!-- Login -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="your username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="pass-wrap">
            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" tabindex="-1" aria-label="Show/hide password">&#128065;</button>
          </div>
        </div>
        <div id="login-error" class="form-error" role="alert"></div>
        <button type="submit" class="btn-primary" id="login-submit">
          <span class="btn-label">Login</span>
          <span class="spinner hidden"></span>
        </button>
      </form>

      <!-- Register -->
      <form id="register-form" class="auth-form hidden" novalidate>
        <div class="field">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" placeholder="min 3 characters" autocomplete="username" required minlength="3" />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <div class="pass-wrap">
            <input id="reg-password" type="password" placeholder="min 6 characters" autocomplete="new-password" required minlength="6" />
            <button type="button" class="toggle-pass" tabindex="-1" aria-label="Show/hide password">&#128065;</button>
          </div>
        </div>
        <div id="register-error" class="form-error" role="alert"></div>
        <button type="submit" class="btn-primary" id="register-submit">
          <span class="btn-label">Create Account</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ===================== CHAT SCREEN ===================== -->
<div id="chat-screen" class="screen hidden">

  <!-- Mobile header -->
  <header id="mobile-header">
    <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
    <span id="mobile-conv-title">AI Chat</span>
    <div style="width:36px"></div>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <div class="user-badge">
        <div class="avatar" id="user-avatar"></div>
        <span id="username-label"></span>
      </div>
      <button id="logout-btn" title="Logout" aria-label="Logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <button id="new-chat-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New conversation
    </button>

    <div class="conv-section-label">Recent</div>
    <ul id="conversation-list" role="listbox" aria-label="Conversations"></ul>
  </aside>

  <!-- Sidebar backdrop (mobile) -->
  <div id="sidebar-backdrop"></div>

  <!-- Main chat area -->
  <main id="chat-area">
    <div id="chat-header">
      <span id="conv-title-header"></span>
      <div id="conv-actions">
        <button class="icon-btn" id="rename-conv-btn" title="Rename" aria-label="Rename conversation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button class="icon-btn danger" id="delete-conv-btn" title="Delete conversation" aria-label="Delete conversation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="chat-messages" role="log" aria-live="polite" aria-label="Messages"></div>

    <div id="input-bar">
      <div id="input-wrap">
        <textarea
          id="message-input"
          placeholder="Message AI…  (Enter to send, Shift+Enter for newline)"
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button id="send-btn" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div id="input-meta">
        <span id="model-badge">gpt-4o-mini</span>
        <span id="char-count"></span>
      </div>
    </div>
  </main>
</div>

<!-- Rename modal -->
<div id="rename-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Rename conversation">
  <div class="modal">
    <h3>Rename conversation</h3>
    <input id="rename-input" type="text" maxlength="255" placeholder="Conversation title" />
    <div class="modal-actions">
      <button class="btn-ghost" id="rename-cancel">Cancel</button>
      <button class="btn-primary" id="rename-confirm">Rename</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div id="delete-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Delete conversation">
  <div class="modal">
    <h3>Delete conversation?</h3>
    <p class="modal-body">This will permanently delete this conversation and all its messages.</p>
    <div class="modal-actions">
      <button class="btn-ghost" id="delete-cancel">Cancel</button>
      <button class="btn-danger" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
